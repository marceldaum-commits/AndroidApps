    // Bild-Bremse für langsame Rechner (z. B. PC ohne Grafik-Beschleunigung): Kostet das Zeichnen eines Bildes im Schnitt

    // statt dass die Seite „hängt“. Läuft es wieder flüssig, wird die Bremse von selbst gelöst. Abschalten: ?bremse=aus
    (function () {

        // die Grafikkarte und würde die Zeit künstlich aufblähen (so geschehen in Marcels erster Diagnose: 66 ms).

        ['pointerdown', 'pointermove', 'keydown', 'wheel', 'touchstart'].forEach(function (ev) {

        });

          // Die erste Eingabe weckt sofort auf. So zeichnet der Garten nicht dauernd das ganze Bild neu, wenn niemand hinsieht.
          var seit = performance.now() - letzteEingabe;
          var ruhe = seit > 20000;
          // Wer gerade tippt, wischt oder auf einen Effekt wartet (letzte Eingabe < 2,5 s), bekommt so viele Bilder wie möglich (höchstens ~30/s,
          // wenn der Rechner langsam ist). Nur wenn niemand etwas tut, laufen Wind und Wolken auf Sparflamme (10 Bilder/s, nach 20 s: 4).
          var aktiv = seit < 2500;

            if (window.wgDiagOn && performance.now() - stat.t0 > 10000) {

            }
          }
          if (!slow && cost > 22) { slow = true; window.wgDiag && window.wgDiag('Bild-Bremse an (Zeichnen ' + Math.round(cost) + ' ms) → weniger Bilder/s, Eingaben haben Vorrang'); }
          // Sehr langsam (z. B. ohne Grafik-Beschleunigung): ab dem nächsten Start mit etwas geringerer Auflösung zeichnen

  <script>

  <script>
    // Erst das Startbild malen, dann die Skripte holen (nacheinander): So sieht man nie eine leere weiße Seite,

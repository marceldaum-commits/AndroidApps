      try { window.wgUmzug = alt ? altSeite() : neu ? neuSeite() : Promise.resolve(); }
      catch (e) { diag('Fehler ' + e); window.wgUmzug = Promise.resolve(); }
    })();
  </script>
  <script>
    // Erst das Startbild malen, dann die Skripte holen (nacheinander): So sieht man nie eine leere weiße Seite,
    // auch wenn das Laden oder Starten später scheitert.
    (function () {
      var started = false;
      var start = function (why) {
        if (started) return; started = true;
        window.wgDiag('Startbild gemalt (' + why + ') → Skripte laden');
        // Startbild aus <body> herausnehmen: Compose legt dort eine Shadow-Root an, die alles andere ausblendet.
        // So bleibt Brummi sichtbar, bis der Garten wirklich gezeichnet ist – nie eine leere Fläche dazwischen.
        try { var sp = document.getElementById('splash'); if (sp) document.documentElement.appendChild(sp); } catch (e) {}
        var list = ['wg-platform.js', 'wg-stimme.js', window.wgModus === 'js' ? 'wissensgarten-js.js' : 'wissensgarten.js'];
        var next = function (i) {
          if (i >= list.length) {
            window.wgDiag('alle Skripte geladen → App startet');
            // Zeitlimit: steht der Wasm-Garten nach 25 s nicht, gilt das als Startfehler (→ automatisch JS-Fassung)
            if (window.wgModus === 'wasm') setTimeout(function () { if (!window.wgReady && document.visibilityState === 'visible') window.wgStartFailed('Wasm-Start: Zeitlimit'); }, 25000);
            return;
          }
          var s = document.createElement('script');
          s.src = list[i];
          s.onload = function () { window.wgDiag('Skript ' + list[i] + ' ok'); next(i + 1); };
          s.onerror = function () { window.wgStartFailed('Datei konnte nicht geladen werden: ' + list[i]); };
          document.body.appendChild(s);
        };
        // Umzug auf die gemeinsame Adresse zuerst (wg-umzug, oben): erst danach liest die App den Speicher
        (window.wgUmzug || Promise.resolve()).then(function () { next(0); }, function () { next(0); });
      };
      requestAnimationFrame(function () { requestAnimationFrame(function () { setTimeout(function () { start('Bild'); }, 20); }); });
      setTimeout(function () { start('Zeit'); }, 500);   // im Hintergrund-Tab ruht requestAnimationFrame
    })();
  </script>

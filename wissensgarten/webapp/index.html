<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wissensgarten – Lernen & Gießen</title>
  <meta name="description" content="Wissensgarten: Lernen wie Gärtnern – jede Karte eine Pflanze, die wächst, wenn du sie gießt. Ohne Werbung, ohne Konto, Fortschritt bleibt im Browser.">
  <meta name="theme-color" content="#3f6b3a">
  <meta name="wg-version" content="2.1.0">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Emoji-Schrift gleich parallel zur App laden (statt erst danach) -->
  <link rel="preload" href="composeResources/de.wissensgarten.web.res/font/noto_color_emoji.ttf" as="fetch" crossorigin>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fbf6ec; overscroll-behavior: none; }
    body { touch-action: manipulation; }
    #splash { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #3f6b3a; background: linear-gradient(#e1f5fe, #fbf6ec 55%, #c5e1a5);
      transition: opacity .5s; text-align: center; padding: 16px; box-sizing: border-box; }
    #splash.weg { opacity: 0; pointer-events: none; }
    #splash .b { font-size: 72px; animation: hop 1.2s ease-in-out infinite; }
    #splash h1 { margin: 0; font-size: 26px; }
    #splash p { margin: 0; color: #5a6b55; }
    #splash .hint { font-size: 14px; max-width: 300px; text-align: center; min-height: 40px; }
    #splash .bar { width: 200px; height: 8px; border-radius: 4px; background: #e6eedd; overflow: hidden; }
    #splash .bar i { display: block; height: 100%; width: 30%; border-radius: 4px; background: #7cb342; animation: lauf 1.4s ease-in-out infinite; }
    #splash .bar.echt i { animation: none; transform: none; transition: width .25s ease-out; }
    #splash .pct { font-size: 13px; color: #5a6b55; min-height: 16px; margin-top: -6px; }
    @keyframes lauf { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
    #splash button { font: 600 15px system-ui, sans-serif; color: #fff; background: #3f6b3a; border: 0; border-radius: 20px; padding: 10px 18px; }
    #splash .links { position: absolute; bottom: 14px; font-size: 13px; }
    #splash a { color: #3f6b3a; }
    @keyframes hop { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }
    #wg-toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 40px); opacity: 0; transition: all .3s;
      background: #2e3b2c; color: #fff; padding: 10px 16px; border-radius: 20px; font: 15px system-ui, sans-serif; max-width: 88vw; z-index: 20; }
    #wg-toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
  <script src="wg-platform.js"></script>
  <script src="wg-stimme.js"></script>
</head>
<body>
  <div id="splash">
    <div class="b">🐝</div>
    <h1>Wissensgarten</h1>
    <p>Brummi gießt gerade die Blumen … 🌱</p>
    <div class="bar" id="bar"><i id="barI"></i></div>
    <div class="pct" id="pct"></div>
    <p class="hint" id="hint"></p>
    <noscript><p>Bitte JavaScript einschalten, dann wächst der Garten.</p></noscript>
    <div class="links">Version 2.1.0 · <a href="https://www.mathenachhilfe-online.com/impressum/" rel="noopener">Impressum</a> ·
      <a href="https://www.mathenachhilfe-online.com/datenschutz/" rel="noopener">Datenschutz</a></div>
  </div>
  <script>
    // Echter Ladebalken: zählt die geladenen Bytes der großen Startdateien (App, Grafik-Engine, Emoji-Schrift).
    (function () {
      const sizes = {"dejavu_symbols.ttf":122572,"noto_color_emoji.ttf":2101784,"bccfa839aa4b38489c76.wasm":8405319,"wissensgarten.js":663454,"94a3498c2f3a8ab71263.wasm":7883425};
      const total = Object.values(sizes).reduce((a, b) => a + b, 0);
      const got = {};
      const bar = document.getElementById('bar'), barI = document.getElementById('barI'), pct = document.getElementById('pct');
      const show = () => {
        if (!total || !document.getElementById('splash')) return;
        const done = Object.values(got).reduce((a, b) => a + b, 0);
        const p = Math.min(99, Math.round(done * 100 / total));
        bar.classList.add('echt'); barI.style.width = p + '%';
        pct.textContent = p + ' %';
      };
      if (!total || !window.ReadableStream || !window.Response) return;
      const orig = window.fetch.bind(window);
      window.fetch = async function (input, init) {
        const res = await orig(input, init);
        try {
          const url = typeof input === 'string' ? input : (input && input.url) || String(input);
          const name = url.split('?')[0].split('/').pop();
          if (!(name in sizes) || !res.ok || !res.body || !document.getElementById('splash')) return res;
          const reader = res.body.getReader();
          got[name] = 0;
          const body = new ReadableStream({
            async pull(c) {
              const r = await reader.read();
              if (r.done) { got[name] = sizes[name]; show(); c.close(); return; }
              got[name] += r.value.byteLength; show(); c.enqueue(r.value);
            },
            cancel(reason) { reader.cancel(reason); },
          });
          return new Response(body, { status: res.status, statusText: res.statusText, headers: res.headers });
        } catch (e) { return res; }
      };
    })();
    // Beim ersten Öffnen lädt der Garten einmal ca. 10 MB (App + Emoji-Bilder) – danach kommt alles aus dem Zwischenspeicher.
    (function () {
      const hint = document.getElementById('hint');
      const say = (t) => { if (document.getElementById('splash') && hint) hint.innerHTML = t; };
      setTimeout(() => say('Beim ersten Mal holt Brummi alle Merkbilder (ca. 7&nbsp;MB). Danach startet der Garten blitzschnell – auch ohne Internet.'), 6000);
      setTimeout(() => say('Das Netz ist gerade langsam … Brummi fliegt weiter. 🐝'), 30000);
      setTimeout(() => say('Das dauert ungewöhnlich lange.<br><br><button onclick="location.reload()">Nochmal versuchen</button>'), 90000);
    })();
    if (!('WebAssembly' in window)) document.querySelector('#splash p').textContent = 'Dieser Browser ist leider zu alt. Bitte Chrome, Edge, Firefox oder Safari aktualisieren.';
    // Automatische Updates ohne Knopf: neue Version wird im Hintergrund geladen und eingespielt –
    // gleich beim Öffnen, sonst sobald die Seite kurz verlassen wird (keine Lernrunde wird unterbrochen).
    if ('serviceWorker' in navigator) {
      const started = Date.now();
      let waiting = false;
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadController) return;                      // erste Installation: nichts neu laden
        if (Date.now() - started < 15000 || document.visibilityState === 'hidden') location.reload();
        else waiting = true;
      });
      document.addEventListener('visibilitychange', () => { if (waiting && document.visibilityState === 'hidden') location.reload(); });
      // Erst wenn der Garten steht: Service Worker anmelden (speichert dann alles für den nächsten Start),
      // damit er beim ersten Laden nicht mit der App um die Leitung konkurriert.
      let registered = false;
      const register = () => { if (registered) return; registered = true;
        navigator.serviceWorker.register('sw.js').then((reg) => {
          const check = () => reg.update().catch(() => {});
          setInterval(check, 30 * 60 * 1000);
          document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
        }).catch(() => {});
      };
      if (hadController) window.addEventListener('load', register);
      else { window.addEventListener('wg-ready', register); setTimeout(register, 120000); }
    }
  </script>
  <script src="wissensgarten.js"></script>
</body>
</html>

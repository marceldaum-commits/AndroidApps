  <!-- Emoji-Schrift gleich parallel zur App laden (statt erst danach) – nur beim ersten Besuch; danach kommt sie aus dem
       Zwischenspeicher des Service Workers (ein Vorab-Laden würde dort nur doppelt laden und eine Konsolen-Warnung erzeugen) -->
  <script>
    if (!(navigator.serviceWorker && navigator.serviceWorker.controller)) {
      const l = document.createElement('link'); l.rel = 'preload'; l.as = 'fetch'; l.crossOrigin = 'anonymous';
      l.href = 'composeResources/de.wissensgarten.web.res/font/noto_color_emoji.ttf'; document.head.appendChild(l);

  </script>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fbf6ec; overscroll-behavior: none; }
    body { touch-action: manipulation; }
    #splash { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #3f6b3a; background: linear-gradient(#e1f5fe, #fbf6ec 55%, #c5e1a5);
      transition: opacity .5s; text-align: center; padding: 16px; box-sizing: border-box; }
    #splash.weg { opacity: 0; pointer-events: none; }
    #splash .b { font-size: 72px; animation: hop 1.2s ease-in-out infinite; }
    #splash h1 { margin: 0; font-size: 26px; }
    #splash p { margin: 0; color: #5a6b55; }
    #splash .hint { font-size: 14px; max-width: 300px; text-align: center; min-height: 40px; }
    #splash .bar { width: 200px; height: 8px; border-radius: 4px; background: #e6eedd; overflow: hidden; }
    #splash .bar i { display: block; height: 100%; width: 30%; border-radius: 4px; background: #7cb342; animation: lauf 1.4s ease-in-out infinite; }
    #splash .bar.echt i { animation: none; transform: none; transition: width .25s ease-out; }
    #splash .pct { font-size: 13px; color: #5a6b55; min-height: 16px; margin-top: -6px; }
    @keyframes lauf { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
    #splash button { font: 600 15px system-ui, sans-serif; color: #fff; background: #3f6b3a; border: 0; border-radius: 20px; padding: 10px 18px; }
    #splash .links { position: absolute; bottom: 14px; font-size: 13px; }
    #splash a { color: #3f6b3a; }
    @keyframes hop { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }
    #wg-toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 40px); opacity: 0; transition: all .3s;
      background: #2e3b2c; color: #fff; padding: 10px 16px; border-radius: 20px; font: 15px system-ui, sans-serif; max-width: 88vw; z-index: 20; }
    #wg-toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
  <script>
    // Nie eine weiße Seite: Jeder Startfehler zeigt eine sichtbare Meldung mit Version und „Neu laden“.
    (function () {
      var shown = false, t0 = Date.now(), notes = [];
      window.wgStartNote = function (t) { notes.push(String(t).slice(0, 300)); if (notes.length > 12) notes.shift(); };
      window.wgStartFailed = function (why) {
        window.wgStartNote(why || 'unbekannt');
        if (shown) { var d = document.getElementById('wg-fail-detail'); if (d) d.textContent = notes.join(' | '); return; }
        shown = true;
        var show = function () {
          var v = document.documentElement.getAttribute('data-version') || '';
          var box = document.createElement('div');
          box.id = 'wg-fail';
          box.style.cssText = 'position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:#fbf6ea;color:#2e3b2c;font:16px system-ui,sans-serif';
          box.innerHTML = '<img src="icons/icon-192.png" width="88" height="88" style="border-radius:20px" alt="">' +
            '<h2 style="margin:0">Der Garten konnte nicht starten 🐝</h2>' +
            '<p style="margin:0;max-width:340px">Bitte einmal neu laden. Klappt es dann noch nicht: Auf iPhone und iPad braucht der Wissensgarten mindestens <b>iOS 18.2</b>, sonst einen aktuellen Chrome, Edge oder Firefox.</p>' +
            '<button onclick="location.reload()" style="font:600 16px system-ui;color:#fff;background:#3f6b3a;border:0;border-radius:22px;padding:12px 22px">Neu laden</button>' +
            '<p style="margin:0;font-size:12px;color:#7a7360">Version ' + v + '</p>' +
            '<p id="wg-fail-detail" style="margin:0;font-size:11px;color:#9a917b;max-width:360px;word-break:break-word">' + notes.join(' | ').replace(/</g, '&lt;') + '</p>';
          document.body.appendChild(box);
        };
        if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
      };
      // Fehler in den ersten 30 Sekunden (Start, erstes Bild) führen zur Meldung statt zu einer leeren Seite
      window.addEventListener('error', function (e) { if (Date.now() - t0 < 30000) window.wgStartFailed((e.message || 'Fehler') + ' @' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '')); });
      window.addEventListener('unhandledrejection', function (e) { if (Date.now() - t0 < 30000) window.wgStartFailed(e.reason && (e.reason.message || e.reason)); });
      // WebAssembly mit „GC“ fehlt älteren Browsern (Safari vor 18.2) – 'WebAssembly' in window erkennt das nicht
      try {
        if (typeof WebAssembly !== 'object' || !WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0])))
          window.wgStartFailed('WebAssembly-GC fehlt (Browser zu alt)');
      } catch (e) { window.wgStartFailed('WebAssembly-Prüfung: ' + e); }
      // iPhone/iPad: Zeichenfläche auf höchstens ~3,5 Mio. Bildpunkte begrenzen – sonst bleibt das Bild auf großen Geräten weiß
      try {
        var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
        var real = window.devicePixelRatio || 1;
        var px = Math.max(screen.width, innerWidth) * Math.max(screen.height, innerHeight);
        // höchstens doppelte Schärfe (statt 3×) und höchstens ~3,5 Mio. Bildpunkte: spart auf dem iPhone viel Grafikspeicher
        var use = Math.max(1, Math.min(real, 2, Math.sqrt(3.5e6 / px)));
        if (ios && use < real) {
          Object.defineProperty(window, 'devicePixelRatio', { get: function () { return use; }, configurable: true });
          window.wgStartNote('iOS-Schärfe ' + real + ' → ' + use.toFixed(2));
        }
      } catch (e) {}
      // Grafik-Kontext verloren (Speicher): Meldung statt leerer Fläche
      window.addEventListener('webglcontextlost', function () { window.wgStartFailed('Grafik-Kontext verloren'); }, true);
    })();
  </script>
  <script src="wg-platform.js"></script>

</head>
<body>
  <div id="splash">
    <img class="b" src="icons/icon-192.png" alt="" width="96" height="96" style="border-radius:22px">
    <h1>Wissensgarten</h1>
    <p>Brummi gießt gerade die Blumen … 🌱</p>
    <div class="bar" id="bar"><i id="barI"></i></div>
    <div class="pct" id="pct"></div>
    <p class="hint" id="hint"></p>
    <noscript><p>Bitte JavaScript einschalten, dann wächst der Garten.</p></noscript>
    <div class="links">Version 2.2.9 · <a href="https://www.mathenachhilfe-online.com/impressum/" rel="noopener">Impressum</a> ·
      <a href="https://www.mathenachhilfe-online.com/datenschutz/" rel="noopener">Datenschutz</a></div>
  </div>
  <script>
    // Echter Ladebalken: zählt die geladenen Bytes der großen Startdateien (App, Grafik-Engine, Emoji-Schrift).
    (function () {
      const sizes = {"dejavu_symbols.ttf":122572,"noto_color_emoji.ttf":2101784,"bccfa839aa4b38489c76.wasm":8405319,"wissensgarten.js":664289,"b6d65c9e78b4d6bd983c.wasm":7996788};
      const total = Object.values(sizes).reduce((a, b) => a + b, 0);
      const got = {};
      const bar = document.getElementById('bar'), barI = document.getElementById('barI'), pct = document.getElementById('pct');
      const show = () => {
        if (!total || !document.getElementById('splash')) return;
        const done = Object.values(got).reduce((a, b) => a + b, 0);
        const p = Math.min(99, Math.round(done * 100 / total));
        bar.classList.add('echt'); barI.style.width = p + '%';
        pct.textContent = p + ' %';
      };
      if (!total || !window.ReadableStream || !window.Response) return;
      const orig = window.fetch.bind(window);
      window.fetch = async function (input, init) {
        const res = await orig(input, init);
        try {
          const url = typeof input === 'string' ? input : (input && input.url) || String(input);
          const name = url.split('?')[0].split('/').pop();
          if (!(name in sizes) || !res.ok || !res.body || !document.getElementById('splash')) return res;
          const reader = res.body.getReader();
          got[name] = 0;
          const body = new ReadableStream({
            async pull(c) {
              const r = await reader.read();
              if (r.done) { got[name] = sizes[name]; show(); c.close(); return; }
              got[name] += r.value.byteLength; show(); c.enqueue(r.value);
            },
            cancel(reason) { reader.cancel(reason); },
          });
          return new Response(body, { status: res.status, statusText: res.statusText, headers: res.headers });
        } catch (e) { return res; }
      };
    })();
    // Beim ersten Öffnen lädt der Garten einmal ca. 10 MB (App + Emoji-Bilder) – danach kommt alles aus dem Zwischenspeicher.
    (function () {
      const hint = document.getElementById('hint');
      const say = (t) => { if (document.getElementById('splash') && hint) hint.innerHTML = t; };
      setTimeout(() => say('Beim ersten Mal holt Brummi alle Merkbilder (ca. 7&nbsp;MB). Danach startet der Garten blitzschnell – auch ohne Internet.'), 6000);
      setTimeout(() => say('Das Netz ist gerade langsam … Brummi fliegt weiter. 🐝'), 30000);
      setTimeout(() => say('Das dauert ungewöhnlich lange.<br><br><button onclick="location.reload()">Nochmal versuchen</button>'), 90000);
    })();
    // Automatische Updates ohne Knopf (Vorgabe: die WebApp ist immer aktuell):
    // - Prüfen beim Öffnen, bei jeder Rückkehr in den Tab (sichtbar/Fokus) und spätestens alle 30 Minuten:
    //   Service-Worker-Update und Abgleich von version.json (ohne Cache).
    // - Neue Version wird sofort aktiv (sw.js: skipWaiting + clients.claim). Neu geladen wird nur in einem
    //   ungefährlichen Moment: gleich beim Start, im Hintergrund oder auf dem Startbildschirm (nie mitten in einer Runde).
    // - Danach kurz „Neue Version x.y.z geladen“. Spielstand (localStorage) und Nova-Dateien bleiben.
    if ('serviceWorker' in navigator) {
      const started = Date.now();
      let pending = false, safe = false, loaded = null, reloading = false;
      const hadController = !!navigator.serviceWorker.controller;
      const reloadNow = () => {
        if (reloading) return; reloading = true;
        try { sessionStorage.setItem('wg.update', '1'); } catch (e) {}
        location.reload();
      };
      const maybeReload = () => { if (pending && (safe || document.visibilityState === 'hidden' || Date.now() - started < 15000)) reloadNow(); };
      window.wgUpdate = { safe: (s) => { safe = !!s; maybeReload(); }, get pending() { return pending; } };
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadController) return;                      // erste Installation: nichts neu laden
        pending = true; maybeReload();
      });
      document.addEventListener('visibilitychange', maybeReload);
      // Nach dem Neuladen: kurzer Hinweis mit der neuen Versionsnummer
      window.addEventListener('wg-ready', () => {
        let was = null; try { was = sessionStorage.getItem('wg.update'); sessionStorage.removeItem('wg.update'); } catch (e) {}
        if (!was) return;
        fetch('version.json?nc=' + Date.now(), { cache: 'no-store' }).then((r) => r.json())
          .then((v) => setTimeout(() => window.wg && window.wg.toast && window.wg.toast('Neue Version ' + v.version + ' geladen 🌱'), 800)).catch(() => {});
      });
      // Erst wenn der Garten steht: Service Worker anmelden (speichert dann alles für den nächsten Start),
      // damit er beim ersten Laden nicht mit der App um die Leitung konkurriert.
      let registered = false;
      const register = () => { if (registered) return; registered = true;
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
          const check = () => {
            reg.update().catch(() => {});
            fetch('version.json?nc=' + Date.now(), { cache: 'no-store' }).then((r) => r.json()).then((v) => {
              if (loaded === null) { loaded = v.version; return; }
              if (v.version !== loaded) reg.update().catch(() => {});   // neue Version auf dem Server: Update anstoßen
            }).catch(() => {});
          };
          check();
          setInterval(check, 30 * 60 * 1000);
          document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
          window.addEventListener('focus', check);
        }).catch(() => {});
      };
      if (hadController) window.addEventListener('load', register);
      else { window.addEventListener('wg-ready', register); setTimeout(register, 120000); }
    }
  </script>

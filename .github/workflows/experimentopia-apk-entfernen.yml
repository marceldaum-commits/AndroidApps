# Einmalig (Vorgabe Marcel 18.11.2026: vorerst nur WebApp): entfernt alle veröffentlichten Experimentopia-APKs aus den GitHub-Releases.
# Die Releases selbst (mit Versionstext) bleiben als Verlauf stehen, nur die APK-Dateien verschwinden. Läuft, wenn diese Datei gepusht wird,
# oder von Hand (Actions → „Run workflow“). Erneut ausführen schadet nicht.
name: Experimentopia APKs entfernen

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/experimentopia-apk-entfernen.yml"]

permissions:
  contents: write

jobs:
  entfernen:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: APK-Dateien aus allen experimentopia-Releases löschen
        run: |
          set -e
          n=0
          for tag in $(gh release list -R "$GITHUB_REPOSITORY" --limit 500 --json tagName -q '.[].tagName' | grep '^experimentopia-v' || true); do
            for asset in $(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -i '\.apk$' || true); do
              echo "lösche $tag / $asset"
              gh release delete-asset "$tag" "$asset" -R "$GITHUB_REPOSITORY" -y
              n=$((n+1))
            done
          done
          echo "Gelöscht: $n APK-Dateien"
          left=0
          for tag in $(gh release list -R "$GITHUB_REPOSITORY" --limit 500 --json tagName -q '.[].tagName' | grep '^experimentopia-v' || true); do
            c=$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets -q '[.assets[].name | select(test("\\.apk$"; "i"))] | length')
            left=$((left+c))
          done
          echo "Verbleibend: $left"
          test "$left" -eq 0

# Baut den Wissensgarten, signiert ihn mit dem Upload-Schlüssel und stellt die APK unter „Releases“ bereit.
# Läuft automatisch bei jedem Push, der den Wissensgarten ändert. Veröffentlicht wird nur, wenn die Version
# (versionName in app/build.gradle.kts) neu ist – jede Version genau einmal. Von Hand: Actions → „Run workflow“.
#
# Secrets (Settings → Secrets and variables → Actions):
#   WG_KEYSTORE_BASE64     = Inhalt von „wissensgarten-upload.jks.base64.txt“ (Drive, Ordner „Schlüssel (geheim)“)
#   WG_KEYSTORE_PROPERTIES = Inhalt von „keystore.properties“ (gleicher Ordner)
# Optional für den Drive-Upload:
#   GDRIVE_SA_JSON         = JSON-Schlüssel eines Google-Dienstkontos
#   GDRIVE_IMPERSONATE     = E-Mail, in deren Namen hochgeladen wird (nur mit domainweiter Delegierung)
# Variable (Settings → Variables): WG_DRIVE_FOLDER = ID des Drive-Ordners „Wissensgarten“
name: Wissensgarten APK

on:
  workflow_dispatch:
  push:
    paths: ["wissensgarten/**", ".github/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Secrets dürfen in „if:“ nicht direkt stehen – darum hier als Merker
      HAS_DRIVE: ${{ secrets.GDRIVE_SA_JSON != '' }}
    defaults:
      run:
        working-directory: wissensgarten
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signatur-Schlüssel einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.WG_KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.WG_KEYSTORE_PROPERTIES }}
        run: |
          # Ohne Schlüssel würde mit dem Test-Schlüssel gebaut – solche APKs ließen sich nicht als Update installieren.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PROPERTIES" ]; then
            echo "::error::Secrets WG_KEYSTORE_BASE64 und WG_KEYSTORE_PROPERTIES fehlen (siehe Kopf dieser Datei)."
            exit 1
          fi
          # Häufigster Fehler: die beiden Secrets vertauscht
          if printf '%s' "$KEYSTORE_BASE64" | grep -q "storePassword"; then
            echo "::error::In WG_KEYSTORE_BASE64 steht der Inhalt von keystore.properties – die beiden Secrets sind vertauscht."
            exit 1
          fi
          if ! printf '%s' "$KEYSTORE_PROPERTIES" | grep -q "storePassword"; then
            echo "::error::WG_KEYSTORE_PROPERTIES enthält keine Zeile 'storePassword=' – bitte den Inhalt von keystore.properties einfügen."
            exit 1
          fi
          # Zeilenumbrüche, Leerzeichen und Windows-Zeilenenden entfernen, dann entschlüsseln
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' > key.b64
          echo "Länge des Schlüsseltexts: $(wc -c < key.b64) Zeichen (erwartet: 5812)"
          if grep -q '[^A-Za-z0-9+/=]' key.b64; then
            echo "::error::WG_KEYSTORE_BASE64 enthält Zeichen, die nicht in den Schlüsseltext gehören (evtl. Überschrift oder Anführungszeichen mitkopiert)."
            exit 1
          fi
          base64 -d key.b64 > wissensgarten-upload.jks || { echo "::error::Schlüsseltext unvollständig – bitte die ganze Datei kopieren."; exit 1; }
          rm key.b64
          printf '%s\n' "$KEYSTORE_PROPERTIES" | tr -d '\r' > keystore.properties
          # Passt das Passwort zum Schlüssel?
          PASS=$(grep '^storePassword=' keystore.properties | cut -d= -f2-)
          keytool -list -keystore wissensgarten-upload.jks -storepass "$PASS" > /dev/null \
            || { echo "::error::Schlüssel und Passwort passen nicht zusammen."; exit 1; }

      - name: Version lesen
        id: version
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Schon veröffentlicht?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "wissensgarten-v${{ steps.version.outputs.name }}" > /dev/null 2>&1; then
            echo "Version ${{ steps.version.outputs.name }} gibt es schon – nur bauen und testen, nichts veröffentlichen."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Logik-Tests
        run: ./gradlew --no-daemon :core:model:test

      - name: APK bauen
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Wissensgarten-${{ steps.version.outputs.name }}.apk"

      - name: Signatur prüfen
        run: |
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs \
            "Wissensgarten-${{ steps.version.outputs.name }}.apk" | tee cert.txt
          grep -qi "9ece481266794bba5ace46e73a8df5a4aec51183d1685fae10438537f5a4d8eb" cert.txt \
            || { echo "::error::APK ist nicht mit dem Upload-Schlüssel signiert."; exit 1; }

      - name: Release veröffentlichen
        if: steps.check.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wissensgarten-v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Wissensgarten ${{ steps.version.outputs.name }}
          body: |
            Signierte APK zum Installieren auf Android (ab Android 8).
            Herunterladen, öffnen, „Aus dieser Quelle installieren“ erlauben. Updates behalten den Lernfortschritt.
          files: wissensgarten/Wissensgarten-${{ steps.version.outputs.name }}.apk

      - name: In Google Drive hochladen
        if: steps.check.outputs.new == 'true' && env.HAS_DRIVE == 'true' && vars.WG_DRIVE_FOLDER != ''
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_IMPERSONATE: ${{ secrets.GDRIVE_IMPERSONATE }}
        run: |
          pip install --quiet google-auth requests
          python ../.github/scripts/drive_upload.py "Wissensgarten-${{ steps.version.outputs.name }}.apk" "${{ vars.WG_DRIVE_FOLDER }}"

      - name: Schlüssel entfernen
        if: always()
        run: rm -f wissensgarten-upload.jks keystore.properties key.b64

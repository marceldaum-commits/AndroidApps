<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raumlicht – Mathe-Abi in 3D</title>
<meta name="description" content="Raumlicht: Oberstufen-Mathe zum Anfassen – Vektoren, Analysis und Stochastik in echtem 3D.">
<meta name="theme-color" content="#0A0E27">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #0A0E27; overflow: hidden; font-family: system-ui, sans-serif; color: #E8ECFF; }
  #app { position: fixed; inset: 0; z-index: 1; }
  #stage { position: fixed; border: 0; display: none; border-radius: 18px; background: #05071a; z-index: 2; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 5; background: #0A0E27; }
  #start b { font-size: 28px; letter-spacing: 1px; } #start span { color: #9AA4D6; font-size: 14px; }
  #start .fehler { color: #FFB45A; max-width: 30em; text-align: center; padding: 0 16px; }
</style>
</head>
<body>
<div id="start"><b>Raumlicht</b><span id="start-text">lädt … Version 2.4.0 vom 15.11.2026</span></div>
<div id="app"></div>
<iframe id="stage" title="3D-Bühne" src="scene/index.html"></iframe>
<script>
  // Ohne WebAssembly-GC (sehr alte Browser) startet die App nicht – das sagen wir, statt eine leere Seite zu zeigen
  window.addEventListener('error', function (e) { var t = document.getElementById('start-text'); if (t && document.getElementById('start').style.display !== 'none') { t.className = 'fehler'; t.textContent = 'Das hat nicht geklappt. Raumlicht braucht einen aktuellen Browser (Chrome, Edge, Firefox oder Safari ab 2024).'; } });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
<script src="raumlicht.js"></script>
</body>
</html>

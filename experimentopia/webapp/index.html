<!doctype html>

<style>
  html, body { margin: 0; height: 100%; background: #160F2E; overflow: hidden; font-family: system-ui, sans-serif; color: #F3EEFF; }
  #app { position: fixed; top: 0; right: 0; bottom: 0; left: 0; }
  /* Ladebild: steht sofort da (reines HTML und CSS) – Nachtlabor, Blubb, Name und ein Balken, der den echten Download zeigt */
  #start { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 5;
    background: #160F2E; background: radial-gradient(ellipse at 50% 38%, #2E2260 0%, #160F2E 62%); transition: opacity .35s ease; }
  #start svg { width: 132px; height: 132px; animation: blubb 2.4s ease-in-out infinite; }
  @keyframes blubb { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-7px) rotate(2deg); } }
  #start b { font-size: 28px; letter-spacing: 2px; font-weight: 800; background: linear-gradient(90deg, #3DF5C8, #7CC8FF, #FF5FA2); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #start span { color: #A99BD6; font-size: 14px; text-align: center; padding: 0 16px; }
  #balken { width: 220px; max-width: 62vw; height: 8px; border-radius: 4px; background: #2E2260; overflow: hidden; }
  #balken i { display: block; height: 100%; width: 3%; border-radius: 4px; background: linear-gradient(90deg, #3DF5C8, #FF5FA2); transition: width .25s ease; }
  .bl { animation: auf 2s ease-in infinite; } .bl.b2 { animation-delay: .7s; } .bl.b3 { animation-delay: 1.3s; }
  @keyframes auf { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-8px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #start svg, .bl { animation: none; } }
  #start .fehler { color: #FFA23D; max-width: 30em; }
</style>
<script>
  // iPhones haben Pixeldichte 3: Die Zeichenfläche wäre riesig und iOS beendet den Tab dann ohne Meldung (weiße Seite).
  // Mit Dichte 2 sieht es genauso scharf aus und braucht gut die Hälfte weniger Grafikspeicher.
  try { if ((window.devicePixelRatio || 1) > 2) Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 2; }, configurable: true }); } catch (e) {}
  // Safari holt Tabs manchmal „eingefroren“ zurück – die Grafik ist dann weg. Sauber neu laden statt eine leere Fläche zu zeigen.
  window.addEventListener('pageshow', function (e) { if (e.persisted) location.reload(); });
  // „App installieren“: Chrome/Edge/Android melden früh, dass die App installierbar ist – das Angebot aufheben, bis jemand auf den Knopf tippt
  window.__exBip = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__exBip = e; if (window.__exInstallChanged) window.__exInstallChanged(); });
  window.addEventListener('appinstalled', function () { window.__exBip = null; if (window.__exInstallChanged) window.__exInstallChanged(); });
</script>
</head>
<body>
<div id="start">
  <svg viewBox="16 8 76 76" aria-hidden="true">
    <!-- dasselbe Logo wie das App-Symbol (icon-512.png, Android ic_launcher_foreground) -->
    <defs><radialGradient id="glut"><stop offset="0" stop-color="#3DF5C8" stop-opacity=".33"/><stop offset="1" stop-color="#3DF5C8" stop-opacity="0"/></radialGradient></defs>
    <circle cx="54" cy="66" r="34" fill="url(#glut)"/>
    <path d="M37 66 L71 66 L77 78 Q78 82 74 82 L34 82 Q30 82 31 78 Z" fill="#3DF5C8"/>
    <path d="M47 30 L47 50 L31 78 Q30 82 34 82 L74 82 Q78 82 77 78 L61 50 L61 30" fill="none" stroke="#F3EEFF" stroke-width="3" stroke-linejoin="round"/>
    <path d="M43 30 L65 30" stroke="#F3EEFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="47" cy="73" r="2.5" fill="#160F2E"/><circle cx="61" cy="73" r="2.5" fill="#160F2E"/>
    <circle class="bl" cx="54" cy="22" r="4" fill="#FF5FA2"/><circle class="bl b2" cx="63" cy="14" r="2.5" fill="#FFD84D"/><circle class="bl b3" cx="46" cy="15" r="2" fill="#7CC8FF"/>
  </svg>
  <b>EXPERIMENTOPIA</b>
  <div id="balken"><i></i></div>
  <span id="start-text">lädt … Version 2.5.3 vom 18.11.2026</span>
</div>
<div id="app"></div>
<script>
  // Nie eine weiße oder leere Seite: Startet die App nicht, erscheint eine Meldung mit Version, Grund und „Neu laden“.
  function iosVersion() { var m = /OS (\d+)_(\d+)/.exec(navigator.userAgent); return (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) && m ? [parseInt(m[1], 10), parseInt(m[2], 10)] : null; }

  function showProblem(why) {
    if (document.getElementById('problem')) return;
    var ios = iosVersion(), gc = wasmGC(), alt = !gc && ios && (ios[0] < 18 || (ios[0] === 18 && ios[1] < 2));   // iOS-Hinweis nur, wenn WasmGC wirklich fehlt
    var text = alt ? 'Dein iPhone/iPad hat iOS ' + ios[0] + '.' + ios[1] + '. Experimentopia braucht mindestens iOS 18.2 – bitte unter Einstellungen → Allgemein → Softwareupdate aktualisieren.'
      : (!gc ? 'Dieser Browser ist zu alt für Experimentopia. Bitte Safari ab iOS 18.2 oder Chrome, Edge oder Firefox ab 2024 verwenden.'
      : 'Experimentopia konnte nicht starten. Meist hilft „Neu laden“. Klappt es dann noch nicht: „Speicher leeren & neu laden“ – dein Spielstand bleibt erhalten.');
    var d = document.createElement('div'); d.id = 'problem';
    d.style.cssText = 'position:fixed;inset:0;z-index:20;background:#160F2E;color:#F3EEFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font:16px system-ui,sans-serif';
    d.innerHTML = '<div style="font-size:54px">🧪</div><b style="font-size:20px">Experimentopia</b><div style="max-width:30em;line-height:1.45"></div>'
      + '<button id="p-neu" style="font:bold 17px system-ui;padding:12px 22px;border-radius:16px;border:2px solid #3DF5C8;background:#1F5C5A;color:#fff">🔄 Neu laden</button>'
      + '<button id="p-leer" style="font:14px system-ui;padding:9px 16px;border-radius:14px;border:1px solid #A99BD6;background:transparent;color:#A99BD6">Speicher leeren & neu laden</button>'
      + '<small style="color:#A99BD6;max-width:34em;word-break:break-word"></small>';
    d.children[2].textContent = text;
    d.children[5].textContent = 'Version 2.5.3 vom 18.11.2026 · ' + (ios ? 'iOS ' + ios.join('.') + ' · ' : '') + 'WasmGC ' + (wasmGC() ? 'ja' : 'nein') + (why ? ' · ' + String(why).slice(0, 160) : '');
    document.body.appendChild(d);
    document.getElementById('p-neu').onclick = function () { location.reload(); };
    document.getElementById('p-leer').onclick = function () {
      var done = function () { location.reload(); };
      try { Promise.all([
        navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : null,
        window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k !== 'experimentopia-nova'; }).map(function (k) { return caches.delete(k); })); }) : null
      ]).then(done, done); } catch (e) { done(); }
    };
  }
  window.__exStarted = 0;   // Zeitpunkt, an dem die App ihre Oberfläche gezeigt hat
  function startFailed(why) {
    var st = document.getElementById('start');
    // vor dem Start und in den ersten Sekunden danach (die App hat dann noch nichts Sichtbares gezeichnet) ist jeder Fehler ein Startfehler
    if (st && (st.dataset.fertig !== '1' || (window.__exStarted && Date.now() - window.__exStarted < 8000 && !appVisible()))) showProblem(why);
  }
  // Compose legt seine Zeichenfläche im Shadow-DOM von #app an
  function appVisible() { var a = document.getElementById('app'); var c = a && ((a.shadowRoot && a.shadowRoot.querySelector('canvas')) || a.querySelector('canvas')); return !!(c && c.width > 0 && c.height > 0); }
  window.addEventListener('error', function (e) { startFailed(e.message); });
  window.addEventListener('unhandledrejection', function (e) { startFailed(e.reason); });
  // Wächter: nach 60 s noch nicht gestartet, oder nach dem Start keine Zeichenfläche → Meldung statt leerer Seite
  setTimeout(function () { var st = document.getElementById('start'); if (st && st.dataset.fertig !== '1') showProblem('Start dauert zu lange'); }, 60000);
  (function watch() { var st = document.getElementById('start'); if (st && st.dataset.fertig === '1') { window.__exStarted = Date.now(); setTimeout(function () {
    if (!appVisible()) { showProblem('keine Zeichenfläche'); return; }
    // Verliert iOS den Grafik-Kontext (Metal/WebGL), zeigen wir das an, statt still eine leere Fläche zu lassen
    var a = document.getElementById('app'); var c = (a.shadowRoot && a.shadowRoot.querySelector('canvas')) || a.querySelector('canvas');
    c.addEventListener('webglcontextlost', function (e) { e.preventDefault(); showProblem('Grafik vom System zurückgesetzt (WebGL-Kontext verloren)'); }, false);
  }, 4000); } else setTimeout(watch, 300); })();
  // WebAssembly mit „GC“ fehlt älteren Browsern: gleich prüfen, nicht erst alles laden
  try { if (typeof WebAssembly !== 'object' || !WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]))) showProblem('WebAssembly-GC fehlt'); } catch (e) { startFailed(e); }
  // ── Laden mit echtem Fortschritt: App-Kern (.wasm) und Schriften werden sofort angefordert, jedes ankommende Byte bewegt den Balken.
  var PLAN = { "bccfa839aa4b38489c76.wasm": 8405319, "df492c986c394580c9cc.wasm": 5417758, "fonts/dejavu_sans.ttf": 120976, "fonts/noto_color_emoji.ttf": 666292, "experimentopia.js": 592379 }, got = {}, total = 0, early = {};
  for (var k in PLAN) total += PLAN[k];
  function progress() {
    var sum = 0; for (var k in PLAN) sum += Math.min(got[k] || 0, PLAN[k]);
    var p = total ? Math.min(100, Math.round(100 * sum / total)) : 0; var st = document.getElementById('start'); if (!st || st.style.display === 'none') return;
    document.querySelector('#balken i').style.width = Math.max(3, p) + '%';
    var t = document.getElementById('start-text'); if (t.className !== 'fehler') t.textContent = p >= 100 ? 'startet …' : 'lädt … ' + p + ' %';
  }
  function keyOf(u) { u = String(u).split('?')[0]; for (var k in PLAN) if (u === k || u.slice(-k.length - 1) === '/' + k) return k; return null; }
  var realFetch = window.fetch;
  function tracked(key, input, init) {
    return realFetch.call(window, input, init).then(function (r) {
      if (!r.ok || !r.body || typeof ReadableStream !== 'function') { if (r.ok) { got[key] = PLAN[key]; progress(); } return r; }
      var reader = r.body.getReader();
      var stream = new ReadableStream({
        start: function (c) { (function next() { reader.read().then(function (x) { if (x.done) { got[key] = PLAN[key]; progress(); c.close(); } else { got[key] = (got[key] || 0) + x.value.byteLength; progress(); c.enqueue(x.value); next(); } }, function (e) { c.error(e); }); })(); },
        cancel: function (why) { return reader.cancel(why); } }, { highWaterMark: Infinity });
      return new Response(stream, { status: r.status, statusText: r.statusText, headers: r.headers });
    });
  }
  if (realFetch) {
    try { for (var k in PLAN) if (/\.(wasm|ttf)$/.test(k)) early[k] = tracked(k, k); } catch (e) { early = {}; }
    window.fetch = function (input, init) {
      var key = keyOf(typeof input === 'string' ? input : (input && input.url) || '');
      if (key && early[key]) { var p = early[key]; delete early[key]; return p; }
      return key ? tracked(key, input, init) : realFetch.call(window, input, init);
    };
  }
  // Automatisches Update – ohne Knopf: Die Seite fragt beim Öffnen, beim Zurückkehren und alle 30 Minuten nach einer neuen Version.
  // Ist eine da, lädt sie der Service Worker im Hintergrund; danach lädt sich die Seite von selbst neu – aber nur an einer ruhigen Stelle
  // (Startseite oder App im Hintergrund), nie mitten in einem Versuch.
  window.__exHome = true; var updateWaiting = false;
  window.__exTry = function () { if (updateWaiting && (document.hidden || window.__exHome)) { updateWaiting = false; try { sessionStorage.setItem('exVorher', '2.5.3'); } catch (e) {} location.reload(); } };
  // Nach einem automatischen Update kurz zeigen, welche Version jetzt läuft (Spielstand und Einstellungen bleiben unangetastet)
  try { var vorher = sessionStorage.getItem('exVorher'); if (vorher) { sessionStorage.removeItem('exVorher'); if (vorher !== '2.5.3') window.addEventListener('load', function () {
    var n = document.createElement('div'); n.id = 'neu'; n.textContent = '✨ Neue Version 2.5.3 geladen';
    n.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9;background:#2A1F55;color:#F3EEFF;border:1px solid #3DF5C8;border-radius:14px;padding:10px 16px;font:14px sans-serif;transition:opacity .6s';
    document.body.appendChild(n); setTimeout(function () { n.style.opacity = '0'; }, 4000); setTimeout(function () { n.remove(); }, 4800); }); } } catch (e) {}
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    var hadWorker = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadWorker) { updateWaiting = true; window.__exTry(); } hadWorker = true; });
    var startSW = function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
        // Abgleich mit version.json (nie aus einem Zwischenspeicher) und Nachfrage beim Service Worker
        var check = function () {
          reg.update().catch(function () {});
          fetch('version.json?nc=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (v) {
            if (v && v.version && v.version !== '2.5.3') reg.update().catch(function () {});
          }).catch(function () {});
        };
        check();
        document.addEventListener('visibilitychange', function () { if (document.hidden) window.__exTry(); else check(); });
        window.addEventListener('focus', check);
        setInterval(check, 30 * 60 * 1000);
      });
    };
    // erst wenn die App läuft – beim Start gehört die Leitung dem App-Kern
    var waitSW = setInterval(function () { var st = document.getElementById('start'); if (!st || st.dataset.fertig === '1' || document.getElementById('problem')) { clearInterval(waitSW); startSW(); } }, 400);
  }
</script>
<script src="experimentopia.js" onload="got['experimentopia.js'] = PLAN['experimentopia.js']; progress();"></script>
